<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whack-a-Mole</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --text: #f8fafc;
      --accent: #f59e0b;
      --accent-2: #10b981;
      --hole: #3f2a1d;
      --mole: #fbbf24;
      --shadow: rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #111827, #0f172a);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .game {
      width: min(92vw, 760px);
      background: var(--panel);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 45px var(--shadow);
    }

    .header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 2.3rem);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 1rem;
      cursor: pointer;
      color: var(--text);
      background: var(--accent);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    button:hover { transform: translateY(-1px); }

    button:active { transform: translateY(0); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(90px, 1fr));
      gap: 10px;
      margin: 16px 0 20px;
    }

    .stat-card {
      background: rgba(255,255,255,0.06);
      padding: 12px;
      border-radius: 14px;
      text-align: center;
    }

    .stat-label { font-size: 0.85rem; opacity: 0.85; }
    .stat-value { font-size: 1.35rem; font-weight: bold; margin-top: 4px; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(90px, 1fr));
      gap: 16px;
    }

    .hole {
      aspect-ratio: 1;
      border-radius: 22px;
      background: linear-gradient(180deg, #7c3f1f, var(--hole));
      border: 3px solid rgba(255,255,255,0.08);
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.2);
      cursor: pointer;
    }

    .mole {
      position: absolute;
      inset: 14px 14px auto 14px;
      height: 54%;
      border-radius: 50% 50% 38% 38%;
      background: radial-gradient(circle at 30% 25%, #fff5b0, var(--mole) 40%, #d97706 100%);
      transform: translateY(110%);
      transition: transform 0.2s ease;
      display: grid;
      place-items: center;
      font-size: 2rem;
      box-shadow: inset 0 -6px 0 rgba(0,0,0,0.17);
    }

    .hole.active .mole {
      transform: translateY(0);
    }

    .message {
      margin-top: 16px;
      text-align: center;
      color: #fde68a;
      font-weight: bold;
      min-height: 1.5em;
    }

    @media (max-width: 560px) {
      .board { gap: 12px; }
      .hole { border-radius: 16px; }
      .mole { font-size: 1.5rem; }
      .stats { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="header">
      <h1>Whack-a-Mole</h1>
      <div class="controls">
        <button id="startBtn">Start Game</button>
        <button id="restartBtn" style="background:#10b981;">Restart</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="time">30</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Best</div>
        <div class="stat-value" id="best">0</div>
      </div>
    </div>

    <div class="board" id="board" role="grid" aria-label="Whack-a-Mole board"></div>
    <div class="message" id="message">Click Start to play!</div>
  </div>

  <script>
    const board = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const bestEl = document.getElementById('best');
    const messageEl = document.getElementById('message');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    const holes = Array.from({ length: 9 }, (_, index) => ({
      index,
      el: null
    }));

    let score = 0;
    let timeLeft = 30;
    let activeHole = null;
    let gameActive = false;
    let timerId = null;
    let moleId = null;
    let bestScore = Number(localStorage.getItem('whackAMoleBest') || 0);

    bestEl.textContent = bestScore;

    function createBoard() {
      board.innerHTML = '';
      holes.forEach((hole) => {
        const button = document.createElement('button');
        button.className = 'hole';
        button.type = 'button';
        button.setAttribute('aria-label', `Hole ${hole.index + 1}`);
        button.innerHTML = '<span class="mole">🐹</span>';
        button.addEventListener('click', () => hitHole(hole.index));
        hole.el = button;
        board.appendChild(button);
      });
    }

    function updateScoreboard() {
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      bestEl.textContent = bestScore;
    }

    function showMole() {
      if (!gameActive) return;
      if (activeHole !== null) {
        holes[activeHole].el.classList.remove('active');
      }

      const nextHole = Math.floor(Math.random() * holes.length);
      activeHole = nextHole;
      holes[activeHole].el.classList.add('active');

      clearTimeout(moleId);
      moleId = setTimeout(() => {
        holes[activeHole].el.classList.remove('active');
        activeHole = null;
        if (gameActive) {
          showMole();
        }
      }, 650);
    }

    function hitHole(index) {
      if (!gameActive) return;
      if (activeHole === index) {
        score += 1;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('whackAMoleBest', String(bestScore));
        }
        updateScoreboard();
        holes[index].el.classList.remove('active');
        activeHole = null;
        clearTimeout(moleId);
        messageEl.textContent = 'Nice hit!';
        setTimeout(() => {
          if (gameActive) messageEl.textContent = 'Keep going!';
        }, 350);
        showMole();
      } else {
        messageEl.textContent = 'Miss!';
        setTimeout(() => {
          if (gameActive) messageEl.textContent = 'Keep going!';
        }, 300);
      }
    }

    function startGame() {
      gameActive = true;
      score = 0;
      timeLeft = 30;
      updateScoreboard();
      messageEl.textContent = 'Whack the mole!';
      startBtn.textContent = 'Playing...';
      startBtn.disabled = true;
      clearInterval(timerId);
      clearTimeout(moleId);
      holes.forEach((hole) => hole.el.classList.remove('active'));
      activeHole = null;
      showMole();

      timerId = setInterval(() => {
        timeLeft -= 1;
        updateScoreboard();
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerId);
      clearTimeout(moleId);
      holes.forEach((hole) => hole.el.classList.remove('active'));
      activeHole = null;
      startBtn.disabled = false;
      startBtn.textContent = 'Start Game';
      messageEl.textContent = `Time's up! You scored ${score}.`;
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    createBoard();
    updateScoreboard();
  </script>
</body>
</html>
